name: Main quality

on:
  push:
    branches:
      - main
      - audit/security-ci-fixes
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: main-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-quality:
    name: Go quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        id: go
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" && -n "$PR_BASE_SHA" ]] && git cat-file -e "${PR_BASE_SHA}^{commit}" 2>/dev/null; then
            base="$PR_BASE_SHA"
          elif [[ -n "$BEFORE_SHA" && "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]] && git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            base="$BEFORE_SHA"
          elif git rev-parse --verify HEAD^1 >/dev/null 2>&1; then
            base="HEAD^1"
          else
            base=""
          fi
          if [[ -n "$base" ]]; then
            mapfile -t changed < <(git diff --name-only --diff-filter=ACMR "$base" HEAD -- '*.go')
          else
            mapfile -t changed < <(git ls-files '*.go')
          fi
          if (( ${#changed[@]} > 0 )); then
            files="$(gofmt -l "${changed[@]}")"
            test -z "$files" || { printf 'Unformatted changed Go files:\n%s\n' "$files"; exit 1; }
          fi
      - name: Vet
        if: ${{ !cancelled() && steps.go.outcome == 'success' }}
        run: go vet ./...
      - name: Build
        if: ${{ !cancelled() && steps.go.outcome == 'success' }}
        run: go build ./...
      - name: Test core packages with race detector
        if: ${{ !cancelled() && steps.go.outcome == 'success' }}
        env:
          CGO_ENABLED: "1"
        run: |
          # Copy and rendering surfaces whose defects reached main because no
          # workflow ran them.
          go test -race -count=1 \
            ./internal/paths \
            ./internal/config \
            ./internal/credentials \
            ./internal/pluginmanager \
            ./internal/harness \
            ./internal/harness/installctrl \
            ./internal/recovery \
            ./internal/startuprec \
            ./internal/startuptrace \
            ./internal/app/project \
            ./internal/app/assistant \
            ./internal/app/updater \
            ./internal/app/market \
            ./internal/app/launcher \
            ./internal/dsh \
            ./internal/dsh/api \
            ./internal/dsh/events \
            ./internal/markdownsyntax \
            ./internal/mathrender \
            ./internal/shortcutprefs \
            ./internal/shortcuts \
            ./internal/store/assistant \
            ./internal/store/custompanel \
            ./internal/store/dshbot \
            ./internal/store/hostterminal \
            ./internal/store/im \
            ./internal/store/imonboard \
            ./internal/store/interaction \
            ./internal/store/market \
            ./internal/store/office \
            ./internal/store/pad \
            ./internal/store/remote \
            ./internal/store/schedule \
            ./internal/store/session \
            ./internal/store/sessioncost \
            ./internal/store/settings \
            ./internal/store/usage \
            ./internal/errcopy \
            ./internal/hoststate \
            ./internal/ui/boot \
            ./internal/ui/browserpreview \
            ./internal/ui/i18n \
            ./internal/ui/interaction \
            ./internal/ui/launcher \
            ./internal/ui/layoutstability \
            ./internal/jobflow \
            ./internal/workflowrun \
            ./internal/accountcontact \
            ./internal/accountdetails \
            ./internal/accountlogin \
            ./internal/accountlogout \
            ./internal/app/startup \
            ./internal/cicoverage \
            ./internal/directorypicker \
            ./internal/openui/card \
            ./internal/openui/lang \
            ./internal/openui/lang/whaleui \
            ./internal/petdirect \
            ./internal/petgrowth \
            ./internal/petwatch \
            ./internal/projectflow \
            ./internal/renderpolicy \
            ./internal/startupsuggest \
            ./internal/state \
            ./internal/store/internal/storefs \
            ./internal/testwait \
            ./internal/ui/design \
            ./internal/ui/designguard \
            ./internal/uipurity \
            ./tools/gen-api \
            ./tools/gen-events
      - name: Test build storage contracts
        if: ${{ !cancelled() }}
        run: node --test scripts/build-storage.test.mjs

  ui-windows:
    name: UI packages (Windows)
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Test UI packages
        shell: bash
        run: |
          # The first four packages assert Windows copy, path decoding and layout
          # behaviour. Portability debt: file:// decoding, long- vs short-form
          # local paths, hover and focus repaint, and badge geometry all assume
          # Windows, so moving them to the Linux job needs real work rather than
          # a workflow edit. The remaining UI surface packages ride the same
          # job: their tests compile on Linux but exercise layout, rendering and
          # platform copy that have only ever been verified on Windows. Every
          # test added here must pass on a clean runner.
          # TestAccountAvatarLoadsAsyncCachesNegativeAndBoundsLRU asserts a timing
          # outcome rather than a contract: it requires the first render to return
          # before the async avatar decode finishes, and a hosted runner can win
          # that race. Excluded by name here so the exclusion stays visible where
          # this job is read, instead of hiding as a skip inside the test.
          go test -count=1 -p 4 \
            -skip '^TestAccountAvatarLoadsAsyncCachesNegativeAndBoundsLRU$' \
            ./internal/ui/settings \
            ./internal/ui/files \
            ./internal/ui/chat \
            ./internal/ui/composer \
            ./internal/ui/agents \
            ./internal/ui/assistant \
            ./internal/ui/chrome \
            ./internal/ui/coss \
            ./internal/ui/custompanel \
            ./internal/ui/dirpick \
            ./internal/ui/filelink \
            ./internal/ui/im \
            ./internal/ui/market \
            ./internal/ui/openui \
            ./internal/ui/planpreview \
            ./internal/ui/pluginmanager \
            ./internal/ui/projects \
            ./internal/ui/remote \
            ./internal/ui/schedule \
            ./internal/ui/sessioncost \
            ./internal/ui/settings/failurepolicy \
            ./internal/ui/sidebar \
            ./internal/ui/terminal \
            ./internal/ui/theme \
            ./internal/ui/toastpolicy \
            ./internal/ui/usage \
            ./internal/ui/webview \
            ./internal/ui/welcome \
            ./internal/ui/widgets \
            ./internal/ui/widgets/ansi \
            ./internal/ui/widgets/diff \
            ./internal/ui/widgets/markdown \
            ./internal/ui/workspacepicker
      - name: Test diffsurface UI package
        shell: bash
        # diffsurface spawns real git subprocesses in fixture tests whose wait
        # deadlines can expire when starved by 33 other UI packages compiling
        # and running in parallel on Windows.
        run: go test -count=1 ./internal/ui/diffsurface
      - name: Test the native directory picker
        shell: bash
        # The Linux entry job excludes this test because native mode needs a
        # picker backend that only exists on Windows and macOS. Its config-merge
        # half still has to be covered in CI, so it runs here by name.
        run: |
          go test -count=1 \
            -run '^TestDirectoryPickerNativeModeAndWorkspacePersistMergeExternalConfigEdit$' \
            ./cmd/whaleisle

  windows-native-packages:
    name: Windows native packages
    runs-on: windows-latest
    timeout-minutes: 55
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Test the native desktop packages
        shell: bash
        # These assert Windows behaviour directly: the preview helper is an
        # AppContainer process with its own window, sshremote drives a Windows
        # tunnel, importer walks an Electron profile layout, and voicecapture
        # binds the capture API. previewprocess and voicecapture were until now
        # only compiled (preview-native-build.yml runs go build,
        # voice-native-build.yml runs go test -c), so this is the first job that
        # executes their tests at all.
        # internal/ui/frame belongs here for the same reason: it asserts the
        # desktop shortcut model. On the fallback (non-desktop) grammar
        # TestDSK10ReboundCommandsKeepInputOwnership fails at
        # shortcut_preferences_test.go:80 because page.close binds Mod+W, which
        # that grammar reserves for system and text-editing actions. The
        # shortcuts package's own tests already skip under the fallback grammar
        # for exactly these Mod+B/Mod+W defaults, so this is a known platform
        # boundary rather than a defect introduced by running it.
        # internal/desktop/pet's anime4k provenance test asserts the checked-out
        # bytes of a 9 MiB text asset; the runner's default core.autocrlf=true
        # produces the CRLF identity the test wants. It fails on LF checkouts —
        # keep it off any job whose checkout might be LF.
        run: |
          go test -count=1 \
            ./internal/ui/frame \
            ./internal/desktop/previewprocess \
            ./internal/desktop/sshremote \
            ./internal/desktop/importer \
            ./internal/desktop/voicecapture \
            ./internal/desktop/acp \
            ./internal/desktop/appuninstall \
            ./internal/desktop/avatarimage \
            ./internal/desktop/botnotify \
            ./internal/desktop/bridgealerts \
            ./internal/desktop/browserrecording \
            ./internal/desktop/components \
            ./internal/desktop/credentialrefs \
            ./internal/desktop/deeplink \
            ./internal/desktop/editors \
            ./internal/desktop/htmldocument \
            ./internal/desktop/htmlpreview \
            ./internal/desktop/imagepreview \
            ./internal/desktop/imgcache \
            ./internal/desktop/localservers \
            ./internal/desktop/market \
            ./internal/desktop/mcpconfig \
            ./internal/desktop/media \
            ./internal/desktop/notifications \
            ./internal/desktop/openui \
            ./internal/desktop/pdfpreview \
            ./internal/desktop/pet \
            ./internal/desktop/phoneremote \
            ./internal/desktop/platformview \
            ./internal/desktop/plugininventory \
            ./internal/desktop/pluginrpc \
            ./internal/desktop/pluginslots \
            ./internal/desktop/proactive \
            ./internal/desktop/projectbridge \
            ./internal/desktop/projectpreference \
            ./internal/desktop/providerdiscovery \
            ./internal/desktop/providerprofiles \
            ./internal/desktop/screenglance \
            ./internal/desktop/svgrender \
            ./internal/desktop/taskcontrol \
            ./internal/desktop/taskguard \
            ./internal/desktop/update \
            ./internal/desktop/voiceinput \
            ./internal/desktop/wallpapers \
            ./internal/desktop/webview \
            ./internal/desktop/whale \
            ./internal/desktop/workspaceauth \
            ./internal/desktop/workspacefs \
            ./internal/installhealth \
            ./internal/processutil \
            ./scripts/nsis \
            ./scripts/session-runtime-links \
            ./tools/core-host-check

  entry-and-git:
    name: Entry point and git packages
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Test entry point and git packages
        shell: bash
        # No -race here on purpose: ./cmd/whaleisle is 87s and
        # ./internal/desktop/git is 205s on a loaded machine, so under the race
        # detector they would dominate wall time for little gain. Their value is
        # that the program still compiles and its behaviour still holds.
        # TestDirectoryPickerNativeModeAndWorkspacePersistMergeExternalConfigEdit
        # needs a native picker backend that only exists on Windows and macOS, so
        # here it fails before the merge behaviour it also covers. It is not
        # uncovered: the "UI packages (Windows)" job above runs it by name, which
        # is where its config-merge half is verified. The exclusion below is that
        # placement, not neglect.
        run: |
          go test -count=1 \
            -skip '^TestDirectoryPickerNativeModeAndWorkspacePersistMergeExternalConfigEdit$' \
            ./cmd/whaleisle \
            ./internal/desktop/git

  cross-build:
    name: Cross-build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: linux
            goarch: amd64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Compile desktop targets
        shell: pwsh
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOTOOLCHAIN: local
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'out'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          foreach ($name in @('whaleisle', 'whaleisle-preview', 'whaleisle-integration')) {
            ./scripts/build-release.ps1 -Package "cmd/$name" -Output (Join-Path $out "$name-$env:GOOS-$env:GOARCH")
          }

  windows-zero-webview-gate:
    name: Windows Zero-WebView2 & Release Strip Gate
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify release build strips test hooks
        working-directory: third_party/mygo
        run: go test -tags release . -run TestReleaseBuildStripsTestHooks
      - name: Build release binary
        shell: pwsh
        run: ./scripts/build-release.ps1 -Package cmd/whaleisle -Output "$env:RUNNER_TEMP\whaleisle.exe"
      - name: Run WorkbenchOnly Zero-WebView2 Gate
        shell: pwsh
        run: pwsh -NoProfile -File scripts/qa-gate-zero-webview.ps1 -Executable "$env:RUNNER_TEMP\whaleisle.exe" -WorkbenchOnly -WarmupSeconds 8
      - name: Run packaging and branding offline fixtures
        shell: pwsh
        run: |
          node scripts/installer-branding-fixture.mjs
          node scripts/package-release-inputs-fixture.mjs
          node --test scripts/session-runtime-slim.test.mjs scripts/session-runtime-composition.test.mjs scripts/runtime-fork-audit.test.mjs scripts/stage-third-party-plugins.test.mjs scripts/harness-fork/fork.test.mjs scripts/harness-fork/archive.test.mjs scripts/harness-fork/download.test.mjs scripts/harness-fork/plugin-compat.test.mjs internal/harness/proactive-tools.test.mjs
      # The installer replays the runtime's directory links at promotion time.
      # A release that installs the payload without them ships capabilities the
      # user cannot reach and reports nothing, so the real installer is built and
      # run here instead of only on a developer machine.
      - name: Restore the NSIS tool cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.tool_cache }}\nsis
          key: nsis-${{ runner.os }}-v1
          restore-keys: |
            nsis-${{ runner.os }}-
      - name: Run the runtime link transaction fixture
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cacheDir = if ($env:RUNNER_TOOL_CACHE) { Join-Path $env:RUNNER_TOOL_CACHE 'nsis' } else { Join-Path $env:RUNNER_TEMP 'nsis-cache' }
          function Resolve-NsisInstallRoot([string]$exeDir) {
            if (-not $exeDir) { return $null }
            if ((Test-Path -LiteralPath (Join-Path $exeDir 'Include') -PathType Container) -or (Test-Path -LiteralPath (Join-Path $exeDir 'Stubs') -PathType Container)) {
              return $exeDir
            }
            if ((Split-Path -Leaf $exeDir) -ieq 'Bin') {
              $parent = Split-Path -Parent $exeDir
              if ($parent -and ((Test-Path -LiteralPath (Join-Path $parent 'Include') -PathType Container) -or (Test-Path -LiteralPath (Join-Path $parent 'Stubs') -PathType Container))) {
                return $parent
              }
            }
            return $null
          }
          function Test-NsisRoot([string]$dir) {
            if (-not $dir) { return $false }
            if (-not (Test-Path -LiteralPath (Join-Path $dir 'makensis.exe') -PathType Leaf)) { return $false }
            return $null -ne (Resolve-NsisInstallRoot $dir)
          }
          function Find-RealMakensis {
            $dirs = New-Object System.Collections.Generic.List[string]
            $dirs.Add($cacheDir)
            $dirs.Add((Join-Path $cacheDir 'Bin'))
            $dirs.Add((Join-Path $cacheDir 'NSIS'))
            if (${env:ProgramFiles(x86)}) {
              $dirs.Add((Join-Path ${env:ProgramFiles(x86)} 'NSIS'))
              $dirs.Add((Join-Path ${env:ProgramFiles(x86)} 'NSIS\Bin'))
            }
            if ($env:ProgramFiles) {
              $dirs.Add((Join-Path $env:ProgramFiles 'NSIS'))
              $dirs.Add((Join-Path $env:ProgramFiles 'NSIS\Bin'))
            }
            foreach ($dir in $dirs) {
              if (Test-NsisRoot $dir) {
                return (Join-Path $dir 'makensis.exe')
              }
            }
            return $null
          }

          $makensis = Find-RealMakensis
          if (-not $makensis) {
            # Chocolatey intermittently serves 503s; retry with backoff before
            # falling back to a direct winget download + silent install.
            $installed = $false
            foreach ($delay in @(0, 5, 15)) {
              if ($delay -gt 0) { Start-Sleep -Seconds $delay }
              choco install nsis --no-progress -y
              if ($LASTEXITCODE -eq 0) { $installed = $true; break }
              Write-Warning "choco install nsis exited $LASTEXITCODE"
            }
            if ($installed) {
              $makensis = Find-RealMakensis
              if ($makensis -and -not ($makensis.StartsWith($cacheDir, [StringComparison]::OrdinalIgnoreCase))) {
                $srcRoot = Resolve-NsisInstallRoot (Split-Path -Parent $makensis)
                if ($srcRoot) {
                  New-Item -ItemType Directory -Force -Path $cacheDir | Out-Null
                  Copy-Item -Recurse -Force (Join-Path $srcRoot '*') $cacheDir
                  foreach ($candidate in @((Join-Path $cacheDir 'makensis.exe'), (Join-Path $cacheDir 'Bin\makensis.exe'))) {
                    if (Test-NsisRoot (Split-Path -Parent $candidate)) {
                      $makensis = $candidate
                      break
                    }
                  }
                }
              }
            }
          }
          if (-not $makensis) {
            $winget = Get-Command winget -ErrorAction SilentlyContinue
            if ($winget) {
              $dl = Join-Path $env:RUNNER_TEMP ('nsis-dl-' + [guid]::NewGuid().ToString('N'))
              New-Item -ItemType Directory -Force -Path $dl | Out-Null
              try {
                & $winget.Source download --id NSIS.NSIS --download-directory $dl --accept-package-agreements --accept-source-agreements
                if ($LASTEXITCODE -ne 0) { throw "winget download NSIS failed (exit $LASTEXITCODE)" }
                $setup = Get-ChildItem $dl -Filter '*.exe' | Select-Object -First 1
                if (-not $setup) { throw "NSIS installer not found under $dl" }
                New-Item -ItemType Directory -Force -Path $cacheDir | Out-Null
                $proc = Start-Process -FilePath $setup.FullName -ArgumentList @('/S', "/D=$cacheDir") -PassThru -WindowStyle Hidden
                if (-not $proc.WaitForExit(180000)) { throw 'NSIS silent installer did not exit within 180 seconds' }
                if ($proc.ExitCode -ne 0) { throw "NSIS silent installer failed (exit $($proc.ExitCode))" }
                $makensis = Find-RealMakensis
              } finally {
                Remove-Item -Recurse -Force $dl -ErrorAction SilentlyContinue
              }
            }
          }
          if (-not $makensis) {
            # Last resort when makensis is already usable on PATH without a standard
            # root layout: use it for this run without copying a shim into $cacheDir.
            $onPath = Get-Command makensis -ErrorAction SilentlyContinue
            if ($onPath -and (Test-Path -LiteralPath $onPath.Source -PathType Leaf)) {
              $makensis = $onPath.Source
            }
          }
          if (-not $makensis) { throw 'NSIS is unavailable: cache miss, Chocolatey install failed and the winget fallback did not produce makensis.exe.' }
          $env:PATH = (Split-Path -Parent $makensis) + ';' + $env:PATH
          ./scripts/nsis-runtime-links-fixture.ps1
