<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PDF</title><link rel="stylesheet" href="pdf_viewer.css"><link rel="stylesheet" href="reader.css"></head><body>
<nav aria-label="PDF 阅读工具"><button id="previous" type="button">上一页</button><input id="page" type="number" min="1" value="1" aria-label="页码"><span id="count"></span><button id="next" type="button">下一页</button><select id="zoom" aria-label="缩放"><option value="fit">适应宽度</option><option>25</option><option>50</option><option>75</option><option>100</option><option>125</option><option>150</option><option>200</option><option>300</option><option>400</option><option>500</option></select><span id="status" role="status">正在载入 PDF…</span><button id="retry" hidden type="button">重试</button></nav>
<main id="scrollport" tabindex="0" aria-label="PDF 页面"><div id="pages"></div></main><script type="module" src="reader.js"></script></body></html>
