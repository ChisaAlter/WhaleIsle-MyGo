<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Whale Isle companion</title><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}body{display:flex;flex-direction:column;align-items:center;justify-content:center;user-select:none;font:12px system-ui;color:#20252c} .task{background:#fff;border:1px solid #888;border-radius:8px;padding:5px;text-align:center;max-width:204px} .title{max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap} a{display:inline-block;margin:3px;color:#164778;--app-region:no-drag} small{display:block;color:#555;font-size:10px} #render-notice{max-width:215px;text-align:center}canvas,img{width:96px;height:104px;object-fit:contain;--app-region:drag}img{border-radius:50%;object-fit:cover;width:88px;height:88px} body[data-neural="true"] canvas{width:88px;height:110px} [hidden]{display:none!important}
</style></head><body data-neural="{{NEURAL}}"><img id="fallback" src="fallback.png" alt="Whale Isle companion; drag to move; manage in Settings → Pet" title="拖动移动 · 设置 → 桌宠"><canvas id="sprite" width="192" height="208" hidden aria-label="Desktop pet"></canvas><small id="render-notice">{{RENDER_NOTICE}}</small><div class="task"><small>当前会话 / Current chat</small><div id="task-status" aria-live="polite">{{STATUS}}</div><div id="task-title" class="title">{{TITLE}}</div><span id="task-open">{{OPEN}}</span> <a href="hide" title="本次隐藏；设置 → 桌宠 → 保存可重新显示">隐藏 / Hide</a></div><script src="pet-runtime.js" defer></script></body></html>
