<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Whale Isle MyGo companion</title><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}body{user-select:none;font:12px var(--pet-font,system-ui);color:var(--pet-fg,#20252c);--pet-x:0px;--pet-y:0px;--pet-width:240px;--pet-height:260px;--pet-bg:#fff;--pet-fg:#20252c;--pet-muted:#727985;--pet-border:#dce1e8;--pet-hover:#f0f3f8;--pet-accent:#4a90d9;--pet-danger:#db566b}button,a,summary{--app-region:no-drag}button{font:inherit;color:inherit;cursor:pointer}a{color:inherit;text-decoration:none;cursor:pointer}a[aria-disabled=true]{opacity:.4;cursor:default}button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--pet-accent);outline-offset:2px}[hidden]{display:none!important}.pet-surface{position:fixed;box-sizing:border-box;background:var(--pet-bg);color:var(--pet-fg);border:1px solid var(--pet-border);border-radius:12px;box-shadow:0 5px 22px #0002;--app-region:no-drag}.task{position:fixed;z-index:10;width:214px;max-height:calc(100vh - 8px);overflow-y:auto;padding:12px;scrollbar-width:thin}#pet-bubble{z-index:9;max-width:220px;padding:8px 11px;text-align:center;line-height:1.5}#render-notice{position:fixed;max-width:240px;text-align:center;color:var(--pet-muted);font-size:11px}#render-notice:empty{display:none}#sprite,#fallback{position:fixed;left:var(--pet-x);top:var(--pet-y);width:var(--pet-width);height:var(--pet-height);object-fit:fill;--app-region:no-drag;transform-origin:50% 90%}#fallback{object-fit:contain}#pet-body-hit{position:fixed;background:transparent;--app-region:no-drag;touch-action:none}#pet-status-toggle{position:fixed;left:calc(var(--pet-x) + var(--pet-width) - 60px);top:var(--pet-y);z-index:3;opacity:0;pointer-events:none;transition:opacity 120ms ease;border:1px solid var(--pet-border);border-radius:6px;background:var(--pet-bg);padding:3px 7px}#sprite:hover~#pet-status-toggle,#fallback:hover~#pet-status-toggle,#pet-body-hit:hover~#pet-status-toggle,#pet-status-toggle:hover,#pet-status-toggle:focus-visible,#pet-status-toggle[aria-expanded=true]{opacity:1;pointer-events:auto}.pet-card-head{display:flex;gap:9px;align-items:center;margin-bottom:12px}.pet-avatar{width:36px;height:36px;object-fit:cover;border-radius:50%;background:var(--pet-hover)}.pet-identity{min-width:0;flex:1}.pet-name-row{display:flex;gap:5px;align-items:center;font-weight:600}.pet-name{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.pet-level{border-radius:7px;padding:1px 5px;background:color-mix(in srgb,var(--pet-tier,var(--pet-accent)) 15%,transparent);color:var(--pet-tier,var(--pet-accent));font-size:10px;white-space:nowrap}.pet-relationship{font-size:10px;color:var(--pet-muted);margin-top:3px}.pet-heart{color:#e88ca6}.pet-dot{width:5px;height:5px;border-radius:50%;background:var(--pet-accent);flex:none}.pet-dot.idle{background:var(--pet-border)}.pet-icon{background:none;border:0;color:var(--pet-muted);padding:0 2px;font-size:17px;line-height:22px}.pet-progress-head{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:10px;margin-bottom:5px}.pet-progress-head strong{font-weight:600;color:var(--pet-tier,var(--pet-accent))}.pet-progress-head span{color:var(--pet-muted);font-variant-numeric:tabular-nums}.pet-track{height:9px;position:relative;background:var(--pet-hover);border-radius:3px;overflow:hidden}.pet-fill{height:100%;background:var(--pet-tier,var(--pet-accent));border-radius:3px;transition:width 250ms ease}.pet-rung{position:absolute;top:2px;width:5px;height:5px;transform:translateX(-50%);border-radius:50%;background:var(--pet-bg);opacity:.8}.pet-growth-next{font-size:10px;color:var(--pet-muted);margin-top:5px}.pet-food-row{display:flex;justify-content:space-between;align-items:center;gap:4px;margin-top:8px;font-size:10px;color:var(--pet-muted)}#feed-tokens{display:block;text-align:center;margin-top:9px;padding:8px;border:1px solid color-mix(in srgb,var(--pet-tier,var(--pet-accent)) 50%,transparent);border-radius:10px;background:color-mix(in srgb,var(--pet-accent) 14%,transparent);color:var(--pet-accent);font-size:11px;white-space:nowrap}.pet-food-total{font-size:10px;color:var(--pet-muted);margin-top:3px}.pet-stats{display:grid;gap:7px;padding:12px 0}.pet-stat{display:grid;grid-template-columns:31px 1fr 56px;gap:7px;align-items:center;font-size:10px;color:var(--pet-muted)}.pet-stat .pet-track{height:4px}.pet-stat-value{text-align:right;font-variant-numeric:tabular-nums}.pet-actions{display:grid;grid-template-columns:1fr 1fr;gap:5px;padding-top:9px;border-top:1px solid var(--pet-border)}.pet-actions a{display:flex;gap:7px;align-items:center;padding:7px 8px;border-radius:7px;background:var(--pet-hover);font-size:11px}.pet-actions a:hover:not([aria-disabled=true]){background:color-mix(in srgb,var(--pet-accent) 15%,var(--pet-bg))}.pet-feedback{display:block;font-size:10px;color:var(--pet-muted);line-height:1.45;margin-top:6px}.pet-feedback:empty{display:none}.pet-extra{font-size:10px;color:var(--pet-muted);margin-top:9px}.pet-extra summary{cursor:pointer}.pet-extra a{display:inline-block;padding:5px 2px}.title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pet-legacy{display:none}@media(prefers-reduced-motion:reduce){#pet-status-toggle,.pet-fill{transition:none}}
</style></head><body data-layout="{{PET_LAYOUT}}" data-behavior="{{PET_BEHAVIOR}}" data-presentation="{{PRESENTATION}}" data-neural="{{NEURAL}}" data-rig="{{RIG}}" data-sleeping="{{REST_SLEEPING}}"><img id="fallback" src="fallback.png" alt="Whale Isle MyGo companion" title="拖动移动"><canvas id="sprite" width="192" height="208" hidden aria-label="Desktop pet"></canvas><div id="pet-body-hit" hidden aria-label="Desktop pet body"></div><div id="pet-bubble" class="pet-surface" hidden aria-live="polite"></div><small id="render-notice">{{RENDER_NOTICE}}</small><button id="pet-status-toggle" type="button" aria-controls="pet-status-card" aria-expanded="false">状态</button><section class="task pet-surface" id="pet-status-card" hidden aria-label="宠物状态"><header class="pet-card-head"><img class="pet-avatar" src="fallback.png" alt=""><div class="pet-identity"><div class="pet-name-row"><span class="pet-dot idle" id="pet-work-dot"></span><span class="pet-name" id="pet-name">鲸鱼娘</span><span class="pet-level" id="pet-level">Lv.1</span></div><div class="pet-relationship"><span class="pet-heart" id="pet-hearts">♡♡♡♡♡</span> <span id="pet-relation"></span></div></div><button id="pet-status-close" class="pet-icon" type="button" aria-label="关闭">×</button></header><div class="pet-progress-head"><strong id="pet-tier-name"></strong><span id="pet-growth-points"></span></div><div class="pet-track"><div class="pet-fill" id="pet-growth-fill"></div><div id="pet-growth-rungs"></div></div><div class="pet-growth-next" id="pet-growth-next"></div><div class="pet-food-row"><span id="pet-today"></span><span id="pet-fed"></span></div><a id="feed-tokens" href="feed-tokens" title="只消耗本地游戏粮点，不扣 API 余额">喂食</a><div id="pet-stats" class="pet-stats"></div><nav class="pet-actions"><a id="pet-quick-chat" href="quick-chat"><span>💬</span><span data-label="chat">聊聊</span></a><a id="pet-look" hidden href="look-screen"><span>👀</span><span data-label="look">看看</span></a><a id="pat-pet" href="pat-pet"><span>🤚</span><span data-label="pat">摸摸</span></a><a id="rest-pet" href="{{REST_ACTION}}">{{REST_LABEL}}</a><a href="settings"><span>⚙</span><span data-label="settings">设置</span></a><a href="hide"><span>↘</span><span data-label="hide">隐藏</span></a></nav><small id="care-message" hidden class="pet-feedback" aria-live="polite">{{CARE_MESSAGE}}</small><small id="growth-message" hidden class="pet-feedback" aria-live="polite">{{GROWTH_MESSAGE}}</small><small id="pet-chat-status" hidden class="pet-feedback" aria-live="polite">{{CHAT_STATUS}}</small><details class="pet-extra"><summary data-label="more">更多</summary><div id="task-status">{{STATUS}}</div><div id="task-title" class="title">{{TITLE}}</div><a id="feed-file" href="feed-file" data-label="file">喂文件</a> · <a id="refresh-growth" href="refresh-growth" data-label="refresh">刷新粮仓</a><br><a id="pet-chat" href="chat" data-label="mainChat">打开主会话</a><span id="task-open">{{OPEN}}</span></details><div class="pet-legacy"><small id="care-label">{{CARE_LABEL}}</small><small id="growth-label">{{GROWTH_LABEL}}</small><small id="growth-detail">{{GROWTH_DETAIL}}</small><small id="rest-message">{{REST_MESSAGE}}</small><small id="pet-look-status">{{LOOK_STATUS}}</small></div></section><script src="pet-body.js" defer></script><script src="pet-sleep.js" defer></script><script src="pet-care-animation.js" defer></script><script src="pet-drop.js" defer></script><script src="pet-status.js" defer></script><script src="pet-behavior.js" defer></script><script src="pet-interaction.js" defer></script><script src="anime4k.js" defer></script><script src="pet-super-resolution.js" defer></script><script src="pet-layout.js" defer></script><script src="pet-sprite.js" defer></script><script src="pet-runtime.js" defer></script></body></html>
